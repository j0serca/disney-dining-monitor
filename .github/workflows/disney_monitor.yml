name: Disney Dining Monitor

on:
  workflow_dispatch: # Permite iniciar el relevo o probarlo manualmente con 1 clic
  schedule:
    # Mantenemos también un cron de respaldo cada 6 horas por si acaso
    - cron: '0 */6 * * *'

jobs:
  continuous-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # Permite turnos continuos de hasta 5.5 horas

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Monitoreo continuo con relevo automático
        env:
          DISNEY_AUTH_TOKEN: ${{ secrets.DISNEY_AUTH_TOKEN }}
          DISNEY_REFRESH_TOKEN: ${{ secrets.DISNEY_REFRESH_TOKEN }}
          DISNEY_API_KEY: ${{ secrets.DISNEY_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TARGET_DATE: ${{ secrets.TARGET_DATE }}
          PARTY_SIZE: ${{ secrets.PARTY_SIZE }}
          MEAL_PERIOD: ${{ secrets.MEAL_PERIOD }}
          RESTAURANT_ID: ${{ secrets.RESTAURANT_ID }}
          RESTAURANT_NAME: ${{ secrets.RESTAURANT_NAME }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python disney_monitor.py --relay --max-hours 5.0
