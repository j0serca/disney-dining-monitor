name: Test Disney Auth

on:
  workflow_dispatch:

jobs:
  test-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias y Playwright
        run: |
          pip install -r requirements.txt playwright
          playwright install --with-deps chromium

      - name: Probar login automático con Playwright
        env:
          DISNEY_EMAIL: ${{ secrets.DISNEY_EMAIL }}
          DISNEY_PASSWORD: ${{ secrets.DISNEY_PASSWORD }}
          DISNEY_API_KEY: ${{ secrets.DISNEY_API_KEY }}
          RESTAURANT_ID: ${{ secrets.RESTAURANT_ID }}
          TARGET_DATE: ${{ secrets.TARGET_DATE }}
          PARTY_SIZE: ${{ secrets.PARTY_SIZE }}
        run: |
          python get_token_browser.py

      - name: Guardar captura de pantalla en caso de error
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: login-error-screenshot
          path: error_login.png
          if-no-files-found: ignore
